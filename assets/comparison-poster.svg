<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1300" role="img" aria-labelledby="title desc">
  <title id="title">Play button poster</title>
  <desc id="desc">A simple dark poster with a centered play button.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#2b2d32"/>
      <stop offset="100%" stop-color="#111215"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="900" height="1300" fill="url(#bg)"/>
  <rect width="900" height="1300" fill="#000" opacity="0.20"/>

  <g filter="url(#shadow)">
    <circle cx="450" cy="650" r="170" fill="#f6f5f1" fill-opacity="0.10"/>
    <circle cx="450" cy="650" r="128" fill="#f6f5f1" fill-opacity="0.16"/>
    <circle cx="450" cy="650" r="88" fill="#f6f5f1" fill-opacity="0.18"/>
    <path d="M420 566 L420 734 L558 650 Z" fill="#f6f5f1"/>
  </g>
</svg>
